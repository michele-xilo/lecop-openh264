[package]
name = "lecop-openh264-sys2"
description = "Low-level bindings for OpenH264, with prebuilt x86_64 assembly so no nasm is needed. Fork of openh264-sys2 for lecop."
keywords = ["multimedia", "encoding", "video"]
categories = ["api-bindings", "multimedia::video"]
documentation = "https://docs.rs/lecop-openh264-sys2/"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

exclude = [
    "**/*.dll",
    "**/*.so"
]

[lib]
name = "openh264_sys2"

[features]
default = ["source"]
source = ["dep:cc", "dep:walkdir", "dep:nasm-rs"]
libloading = ["dep:libloading", "dep:sha2"]

[dependencies]
libloading = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }

[build-dependencies]
cc = { workspace = true, features = ["parallel"], optional = true }
walkdir = { workspace = true, optional = true }
nasm-rs = { workspace = true, optional = true }
